<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00d6f4">
  <meta name="robots" content="index, follow">
  <title>Impatient Health webinar</title>
  <meta name="description" content="Watch an Impatient Health webinar.">
  <link rel="shortcut icon" type="image/png" href="https://impatient.health/wp-content/themes/impatient/favicon.png">
  <link rel="stylesheet" href="../style.css?v=1">
  <script defer src="../script.js?v=1"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="https://www.impatient.health/" aria-label="Impatient Health home">
        <img src="../assets/logo-source.png" alt="Impatient" width="600" height="100">
      </a>
      <a class="header-cta" id="header-cta" href="#recording">Watch recording <svg class="line-arrow" aria-hidden="true" viewBox="0 0 18 18"><path d="M3 15 15 3M7 3h8v8"></path></svg></a>
    </div>
  </header>

  <main id="main">
    <section class="hero shell" aria-labelledby="event-title">
      <div class="hero-copy">
        <h1 id="event-title"></h1>
        <p class="hero-premise" id="event-premise"></p>
        <div class="hero-meta">
          <a class="button" id="hero-cta" href="#recording">Watch recording <svg class="line-arrow" aria-hidden="true" viewBox="0 0 18 18"><path d="M3 15 15 3M7 3h8v8"></path></svg></a>
          <p id="event-date"></p>
        </div>
      </div>
      <div class="motion-panel" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </section>

    <section class="speakers" aria-labelledby="speakers-title">
      <div class="shell">
        <h2 id="speakers-title">The people in the <em>conversation.</em></h2>
        <div class="speaker-grid" id="speaker-grid"></div>
      </div>
    </section>

    <section class="editorial shell" aria-labelledby="summary-title">
      <h2 id="summary-title"></h2>
      <div class="editorial-copy"><div id="event-summary"></div><ul id="event-topics"></ul></div>
    </section>

    <section class="recording" id="recording">
      <div class="shell recording-inner">
        <h2>Watch the <em>conversation.</em></h2>
        <p id="recording-copy"></p>
        <a class="button button-dark" id="recording-cta" href="#">Watch recording <svg class="line-arrow" aria-hidden="true" viewBox="0 0 18 18"><path d="M3 15 15 3M7 3h8v8"></path></svg></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <img src="../assets/logo-source.png" alt="Impatient" width="600" height="100">
      <a href="https://www.impatient.health/privacy-policy/">Privacy</a>
    </div>
  </footer>
</body>
</html>
