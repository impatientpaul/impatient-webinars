<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00DBFF">
  <meta name="robots" content="index, follow">
  <title>Impatient Health webinar</title>
  <meta name="description" content="Watch an Impatient Health webinar.">
  <link rel="shortcut icon" type="image/png" href="https://impatient.health/wp-content/themes/impatient/favicon.png">
  <link rel="stylesheet" href="../style.css?v=2">
  <script defer src="../script.js?v=4"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="https://www.impatient.health/" aria-label="Impatient Health home">
        <img src="../assets/logo-source.png" alt="Impatient" width="600" height="100">
      </a>
      <a class="button button-small recording-link" href="#recording">Watch recording
        <svg class="line-arrow" aria-hidden="true" viewBox="0 0 18 18"><path d="M3 15 15 3M7 3h8v8"></path></svg>
      </a>
    </div>
  </header>

  <main id="main">
    <section class="hero shell" aria-labelledby="event-title">
      <div class="hero-copy">
        <h1 id="event-title"></h1>
        <p class="premise" id="event-premise"></p>
        <div class="hero-action">
          <a class="button recording-link" href="#recording">Watch recording
            <svg class="line-arrow" aria-hidden="true" viewBox="0 0 18 18"><path d="M3 15 15 3M7 3h8v8"></path></svg>
          </a>
          <p class="event-date" id="event-date"></p>
        </div>
      </div>
      <figure class="hero-photograph">
        <img src="https://impatientpaul.github.io/impatient-webinars/assets/heroes/webinar93.webp" alt="Event artwork for Does pharma still need to advertise, now that we have AI?" width="1280" height="720" fetchpriority="high">
      </figure>
    </section>

    <section class="people shell" aria-label="The people in the conversation">
      <div class="people-grid" id="speaker-grid"></div>
    </section>

    <section class="discussion shell editorial-grid" aria-labelledby="discussion-title">
      <div class="section-opening">
        <h2 id="discussion-title">What we<br><em>explored.</em></h2>
      </div>
      <div class="discussion-content">
        <ul class="discussion-topics" id="event-topics"></ul>
        <a class="text-link recording-link" href="#recording">Watch recording
          <svg class="line-arrow" aria-hidden="true" viewBox="0 0 18 18"><path d="M3 15 15 3M7 3h8v8"></path></svg>
        </a>
      </div>
    </section>

    <section class="argument" aria-labelledby="summary-title">
      <div class="shell editorial-grid">
        <div class="argument-opening">
          <h2 id="summary-title"></h2>
          <div class="argument-rule" aria-hidden="true"></div>
        </div>
        <div class="prose">
          <div id="event-summary"></div>
          <div class="body-recording">
            <a class="button recording-link" href="#recording">Watch recording
              <svg class="line-arrow" aria-hidden="true" viewBox="0 0 18 18"><path d="M3 15 15 3M7 3h8v8"></path></svg>
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="closing" id="recording" aria-labelledby="closing-title">
      <div class="shell closing-grid">
        <h2 id="closing-title">Watch the<br><em>conversation.</em></h2>
        <div class="closing-details">
          <p class="closing-copy" id="recording-copy"></p>
          <a class="button button-dark recording-link" href="#recording">Watch recording
            <svg class="line-arrow" aria-hidden="true" viewBox="0 0 18 18"><path d="M3 15 15 3M7 3h8v8"></path></svg>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-main">
      <a class="wordmark wordmark-footer" href="https://www.impatient.health/" aria-label="Impatient Health home">
        <img src="../assets/logo-source.png" alt="Impatient" width="600" height="100">
      </a>
      <a href="https://www.impatient.health/privacy-policy/">Privacy</a>
    </div>
  </footer>
</body>
</html>
